spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
security:
  jwt:
    # Chave usada SÓ nos testes. Nunca reutilizar em produção.
    secret: chave-somente-para-testes-nao-usar-em-producao-0123456789
    access-expiration: 900000
    refresh-expiration: 604800000

app:
  admin:
    email: admin@test.com
    senha: senha-de-teste-forte